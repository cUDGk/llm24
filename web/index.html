<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>LLM24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hdr">
    <h1 class="brand">L L M 2 4</h1>
    <div class="status">
      <span id="premium-warn" class="premium-warn" hidden>Premium未確認</span>
      <span id="onair-indicator" class="indicator off" data-i18n="onair_off">オンエア</span>
      <div class="btn-group">
        <button id="btn-lang" class="seg-btn" title="language">JA</button>
        <button id="btn-toggle" class="seg-btn" data-i18n="start">開 始</button>
        <button id="btn-spotify-login" class="seg-btn" hidden data-i18n="spotify_login">SPOTIFY ログイン</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="cell now-playing">
      <h2 class="cell-h" data-i18n="now_playing">再生中</h2>
      <div class="np-body">
        <div class="np-art">
          <img id="np-art" alt="" class="art-img" src="">
          <div id="np-art-fallback" class="art-fb" data-i18n="off_air">— オフエア —</div>
          <div id="loading" class="loading"><span data-i18n="now_loading">読み込み中</span><span class="dots">…</span></div>
        </div>
        <div class="np-info">
          <div class="np-meta">
            <div id="np-title" class="np-title">—</div>
            <div id="np-artist" class="np-artist">—</div>
            <div id="np-state" class="np-state" data-i18n="state_idle">停止中</div>
          </div>
          <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="progress-text" class="progress-text"></div>
          <div id="next-up" class="next-up" hidden>
            <span class="next-label" data-i18n="next_track">次の曲</span>
            <span id="next-title" class="next-title"></span>
            <span id="next-artist" class="next-artist"></span>
          </div>
        </div>
      </div>
      <div id="subtitle" class="subtitle"></div>
    </section>

    <section class="cell right-stack">
      <details class="acc" open>
        <summary class="cell-h"><span data-i18n="mail">お便り</span></summary>
        <form id="mail-form" class="mail-form">
          <label class="field">
            <span data-i18n="radio_name">ラジオネーム</span>
            <input id="m-name" type="text" maxlength="60" required>
          </label>
          <label class="field">
            <span data-i18n="body">本文</span>
            <textarea id="m-body" rows="3" maxlength="2000" required></textarea>
          </label>
          <label class="field">
            <span data-i18n="track_url">Spotifyの曲・プレイリストURL (任意)</span>
            <input id="m-request" type="url" maxlength="500" placeholder="https://open.spotify.com/track/... or /playlist/...">
          </label>
          <label class="check">
            <input id="m-force" type="checkbox">
            <span data-i18n="force_next">次の曲で必ず反映する</span>
          </label>
          <button class="btn btn-primary" type="submit" data-i18n="submit">投 函</button>
          <div id="m-status" class="m-status"></div>
        </form>
      </details>

      <details class="acc">
        <summary class="cell-h"><span data-i18n="sent_mails">投函済み</span></summary>
        <ol id="mail-list" class="mail-list"></ol>
      </details>

      <details class="acc">
        <summary class="cell-h"><span data-i18n="settings">設定</span></summary>
        <form id="settings-form" class="settings-form">
          <div class="field">
            <span data-i18n="genres">ジャンル</span>
            <div id="s-genres-chips" class="chip-input" data-placeholder="自由入力もOK (Enterで確定)"></div>
            <details class="picker genres-picker">
              <summary>ジャンル一覧から選ぶ <span id="genre-picker-hint" class="picker-count"></span></summary>
              <div id="genre-picker-list" class="picker-list"></div>
            </details>
            <div class="field-hint">
              入力中はリストが自動絞り込み (例: "trap" と打つと trap / trap-latino / trap-metal …)。
              一覧に無い文字列は曲名検索フォールバックになり精度が落ちる (「ダリアコア」→ 曲名「ダリア」が混入)。
            </div>
          </div>
          <div class="field">
            <span data-i18n="seed_artists">推しアーティスト (空でジャンル選曲のみ)</span>
            <div id="s-seed-art-chips" class="chip-input" data-placeholder="入力してEnterで追加"></div>
          </div>
          <div class="field">
            <span data-i18n="excl_artists">除外アーティスト</span>
            <div id="s-excl-art-chips" class="chip-input" data-placeholder="入力してEnterで追加"></div>
          </div>
          <label class="field">
            <span data-i18n="personality">性格カスタム</span>
            <input id="s-personality" type="text">
          </label>
          <label class="field">
            <span data-i18n="chat_freq">雑談頻度</span>
            <select id="s-chat-freq">
              <option value="loose" data-i18n="freq_loose">緩い</option>
              <option value="normal" selected data-i18n="freq_normal">普通</option>
              <option value="dense" data-i18n="freq_dense">多め</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="mail_adoption">お便り採用率</span>
            <select id="s-mail-adopt">
              <option value="every" data-i18n="adopt_every">毎回</option>
              <option value="every_few" selected data-i18n="adopt_few">数曲に1回</option>
              <option value="when_full" data-i18n="adopt_full">溜まったら</option>
            </select>
          </label>
          <label class="check">
            <input id="s-jingle" type="checkbox" checked>
            <span data-i18n="jingle_on">時報ジングル ON</span>
          </label>
          <button class="btn" type="submit" data-i18n="save">保 存</button>
          <div id="s-status" class="m-status"></div>
        </form>
      </details>
    </section>

    <section class="cell recent">
      <h2 class="cell-h" data-i18n="recent">最近の曲</h2>
      <ol id="recent-list" class="recent-list"></ol>
    </section>
  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
