<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>LLM24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hdr">
    <h1 class="brand">L L M 2 4</h1>
    <div class="status">
      <button id="btn-lang" class="toggle" title="language">JA</button>
      <button id="btn-theme" class="toggle" title="theme">DARK</button>
      <span id="onair-indicator" class="indicator off">ON AIR</span>
      <button id="btn-onair" class="btn" data-i18n="start">START</button>
      <button id="btn-offair" class="btn" hidden data-i18n="stop">STOP</button>
      <button id="btn-spotify-login" class="btn" hidden data-i18n="spotify_login">SPOTIFY LOGIN</button>
    </div>
  </header>

  <main class="grid">
    <section class="cell now-playing">
      <h2 class="cell-h" data-i18n="now_playing">NOW PLAYING</h2>
      <div class="np-art">
        <img id="np-art" alt="" class="art-img" src="">
        <div id="np-art-fallback" class="art-fb" data-i18n="off_air">— OFF AIR —</div>
      </div>
      <div class="np-meta">
        <div id="np-title" class="np-title">—</div>
        <div id="np-artist" class="np-artist">—</div>
        <div id="np-state" class="np-state" data-i18n="state_idle">idle</div>
      </div>
      <div id="subtitle" class="subtitle"></div>
    </section>

    <section class="cell mail">
      <h2 class="cell-h" data-i18n="mail">MAIL</h2>
      <form id="mail-form" class="mail-form">
        <label class="field">
          <span data-i18n="radio_name">ラジオネーム</span>
          <input id="m-name" type="text" maxlength="60" required>
        </label>
        <label class="field">
          <span data-i18n="body">本文</span>
          <textarea id="m-body" rows="4" maxlength="2000" required></textarea>
        </label>
        <label class="field">
          <span data-i18n="request">リクエスト (任意)</span>
          <input id="m-request" type="text" maxlength="500">
        </label>
        <label class="check">
          <input id="m-force" type="checkbox">
          <span data-i18n="force_next">次の曲で必ず反映する</span>
        </label>
        <button class="btn btn-primary" type="submit" data-i18n="submit">投 函</button>
        <div id="m-status" class="m-status"></div>
      </form>
    </section>

    <section class="cell recent">
      <h2 class="cell-h" data-i18n="recent">RECENT</h2>
      <ol id="recent-list" class="recent-list"></ol>
    </section>

    <section class="cell settings">
      <h2 class="cell-h" data-i18n="settings">SETTINGS</h2>
      <details>
        <summary data-i18n="open_settings">設定を開く</summary>
        <form id="settings-form" class="settings-form">
          <label class="field">
            <span data-i18n="genres">ジャンル (カンマ区切り)</span>
            <input id="s-genres" type="text">
          </label>
          <label class="field">
            <span data-i18n="excl_artists">除外アーティスト (カンマ区切り)</span>
            <input id="s-excl-art" type="text">
          </label>
          <label class="field">
            <span data-i18n="personality">性格カスタム</span>
            <input id="s-personality" type="text">
          </label>
          <label class="field">
            <span data-i18n="chat_freq">雑談頻度</span>
            <select id="s-chat-freq">
              <option value="loose" data-i18n="freq_loose">緩い</option>
              <option value="normal" selected data-i18n="freq_normal">普通</option>
              <option value="dense" data-i18n="freq_dense">多め</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="mail_adoption">お便り採用率</span>
            <select id="s-mail-adopt">
              <option value="every" data-i18n="adopt_every">毎回</option>
              <option value="every_few" selected data-i18n="adopt_few">数曲に1回</option>
              <option value="when_full" data-i18n="adopt_full">溜まったら</option>
            </select>
          </label>
          <label class="check">
            <input id="s-jingle" type="checkbox" checked>
            <span data-i18n="jingle_on">時報ジングル ON</span>
          </label>
          <button class="btn" type="submit" data-i18n="save">保 存</button>
          <div id="s-status" class="m-status"></div>
        </form>
      </details>
    </section>
  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
