<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>LLM24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="hdr">
    <h1 class="brand">L L M 2 4</h1>
    <div class="status">
      <button id="btn-theme" class="toggle" title="表示モード切替">ダーク</button>
      <span id="onair-indicator" class="indicator off">オンエア</span>
      <button id="btn-onair" class="btn">開 始</button>
      <button id="btn-offair" class="btn" hidden>停 止</button>
      <button id="btn-spotify-login" class="btn" hidden>SPOTIFY ログイン</button>
    </div>
  </header>

  <main class="grid">
    <section class="cell now-playing">
      <h2 class="cell-h">再生中</h2>
      <div class="np-art">
        <img id="np-art" alt="" class="art-img" src="">
        <div id="np-art-fallback" class="art-fb">— オフエア —</div>
        <div id="loading" class="loading">読み込み中<span class="dots">…</span></div>
      </div>
      <div class="np-meta">
        <div id="np-title" class="np-title">—</div>
        <div id="np-artist" class="np-artist">—</div>
        <div id="np-state" class="np-state">停止中</div>
      </div>
      <div class="progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-text" class="progress-text"></div>
      <div id="subtitle" class="subtitle"></div>
    </section>

    <section class="cell mail">
      <h2 class="cell-h">お便り</h2>
      <form id="mail-form" class="mail-form">
        <label class="field">
          <span>ラジオネーム</span>
          <input id="m-name" type="text" maxlength="60" required>
        </label>
        <label class="field">
          <span>本文</span>
          <textarea id="m-body" rows="4" maxlength="2000" required></textarea>
        </label>
        <label class="field">
          <span>Spotifyの曲URL (任意)</span>
          <input id="m-request" type="url" maxlength="500" placeholder="https://open.spotify.com/track/...">
        </label>
        <label class="check">
          <input id="m-force" type="checkbox">
          <span>次の曲で必ず反映する</span>
        </label>
        <button class="btn btn-primary" type="submit">投 函</button>
        <div id="m-status" class="m-status"></div>
      </form>
      <div class="mail-history">
        <h3 class="cell-h sub">投函済み</h3>
        <ol id="mail-list" class="mail-list"></ol>
      </div>
    </section>

    <section class="cell recent">
      <h2 class="cell-h">最近の曲</h2>
      <ol id="recent-list" class="recent-list"></ol>
    </section>

    <section class="cell settings">
      <h2 class="cell-h">設定</h2>
      <details>
        <summary>設定を開く</summary>
        <form id="settings-form" class="settings-form">
          <label class="field">
            <span>ジャンル (カンマ区切り)</span>
            <input id="s-genres" type="text">
          </label>
          <label class="field">
            <span>除外アーティスト (カンマ区切り)</span>
            <input id="s-excl-art" type="text">
          </label>
          <label class="field">
            <span>性格カスタム</span>
            <input id="s-personality" type="text">
          </label>
          <label class="field">
            <span>雑談頻度</span>
            <select id="s-chat-freq">
              <option value="loose">緩い</option>
              <option value="normal" selected>普通</option>
              <option value="dense">多め</option>
            </select>
          </label>
          <label class="field">
            <span>お便り採用率</span>
            <select id="s-mail-adopt">
              <option value="every">毎回</option>
              <option value="every_few" selected>数曲に1回</option>
              <option value="when_full">溜まったら</option>
            </select>
          </label>
          <label class="check">
            <input id="s-jingle" type="checkbox" checked>
            <span>時報ジングル ON</span>
          </label>
          <button class="btn" type="submit">保 存</button>
          <div id="s-status" class="m-status"></div>
        </form>
      </details>
    </section>
  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
